# The agreed closed-loop set: ten buildings, a fortnight each.
#
# Each scenario carries its own dates, and they are spread through the year rather than sharing
# one January fortnight. Weather dominates the level of these metrics, so a single date would
# measure that fortnight as much as the controller; spreading them costs nothing, since the
# comparison between controllers stays paired scenario by scenario.

common:
  split: test
  view: realistic
  use_forecast: true
  planning_horizon: 96
  context_days: 21
  forecast_correction: 0.5

scenarios:
  scenario1:
    building: BG.N.SFH.02.Gen.ReEx.001.001--period_b
    start: 2025-04-22
    end: 2025-05-06
    controller: mpc-aprbs-high
