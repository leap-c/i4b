# One building, three windows. For CI, and for checking a method runs at all.

common:
  split: test
  view: realistic
  use_forecast: true
  horizon_hours: 24
  context_days: [7]
  probes: 3
  probe_amplitude: 6.0
  forecast_correction: 0.0

scenarios:
  window001:
    building: BG.N.SFH.02.Gen.ReEx.001.001--period_b
    date: 2025-06-18
    controller: mpc-nominal
  window002:
    building: BG.N.SFH.02.Gen.ReEx.001.001--period_b
    date: 2025-10-10
    controller: mpc-offset-plus-2K
  window003:
    building: BG.N.SFH.02.Gen.ReEx.001.001--period_b
    date: 2026-02-01
    controller: mpc-offset-minus-2K
