# The agreed open-loop set: 30 buildings x 20 windows.
#
# One entry per window, so a window is a problem instance in its own right. Dates are spread
# evenly through each year, so the set covers the seasons rather than leaving it to a seed, and
# the controller names whose recorded run fills the context -- which decides whether the history
# is excited, and so whether the dynamics are identifiable from it at all.

common:
  split: test
  view: realistic
  use_forecast: true
  horizon_hours: 24
  context_days: [1, 2, 5, 21]
  probes: 5
  probe_amplitude: 6.0
  forecast_correction: 0.0

