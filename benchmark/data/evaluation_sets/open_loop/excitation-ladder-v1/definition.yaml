# The excitation ladder: how much control response can be identified from a context, as a
# function of how hard that context was excited.
#
# A dose-response curve, not a leaderboard. `benchmark-v1` scores a method; this set asks what
# the method could have known. It is the ablation behind the two controllers `benchmark-v1`
# settled on -- gain 0.15 under `mpc-nominal` against 0.89 under `open-loop-aprbs` measured
# zero-shot -- run across all nine rungs instead of the two endpoints.
#
# 30 buildings x 1 anchor x 9 rungs = 270 cases, and 4 contexts, so 1080 result rows.
#
# The design is **paired**: every rung sees the same building at the same timestamp, under the
# same weather and the same forecast, so the comparison is within-window rather than across the
# corpus. An unpaired sweep would confound excitation with which building and which week it
# landed on, and the between-building spread in gain is larger than the effect being measured.
# Group on `(scenario_id, start)` to recover a rung's siblings.
#
# What a rung cannot share is its own past: a different recorded controller ran a different year,
# so it reaches the anchor in a different state and with a different plan to probe around. The
# probes and the plant's response to them therefore differ between rungs, and a number here is
# not purely a function of the excitation. That is inherent -- the history is what is being
# varied, and where it ended up is part of it -- and it is the same residual confound
# `benchmark-v1` carries between its two controllers.
#
# The rungs, least to most excited:
#
#   mpc-nominal          none            an MPC holding its comfort band
#   mpc-aprbs-low        low             MPC with a small APRBS residual on its action
#   mpc-aprbs-medium     medium
#   mpc-aprbs-high       high
#   open-loop-aprbs      1.5 K           no feedback at all: APRBS about the heating curve
#   open-loop-aprbs-3K   3 K             the amplitude ladder, appended as training data
#   open-loop-aprbs-6K   6 K
#   open-loop-aprbs-12K  12 K
#   open-loop-aprbs-24K  24 K            far beyond anything a controller would do
#
# The two `mpc-offset-*` controllers are omitted: they shift the comfort bound rather than the
# excitation, so they are a third "none" rung and would cost a ninth of the runtime to say so.
#
# An MPC's action is a function of the state it reacts to, so its effect on the room is
# confounded with the state -- which is why the bottom of this ladder is expected to be flat and
# the open-loop rungs are not. Note that the ladder is *not* ordered by how much the supply
# temperature moved: on the first window here, `mpc-nominal` has a slightly larger context
# control standard deviation than `open-loop-aprbs` (8.70 K against 8.63 K) and about a sixth of
# its measured gain. Excitation here means uncorrelated excitation, not amplitude.
#
# The top of the ladder is deliberately unrealistic: 24 K of APRBS is a system-identification
# experiment, not a heating strategy, and it bounds what any amount of excitation could buy.
#
# Anchors are each building's first `benchmark-v1` window, so both sets sit in the same weeks of
# December and share the same eight time-of-day slots. Everything else -- view, horizon, context
# ladder, probes -- is identical to `benchmark-v1`, so a number here is comparable with one
# there.

common:
  split: test
  view: realistic
  use_forecast: true
  horizon_hours: 24
  context_days: [1, 2, 5, 21]
  probes: 5
  probe_amplitude: 6.0
  probe_hold_steps: 8
  forecast_correction: 0.0

