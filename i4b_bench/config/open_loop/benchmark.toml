# The agreed open-loop set.
#
# Samples widely because open-loop windows are cheap: the plant rollouts behind 600 windows cost
# about as much wall-clock as the closed-loop set does when its scenarios are distributed, and
# more windows is the only thing that puts error bars on small differences between methods.
#
# `seeds` is a count, not a random seed. Windows are placed evenly through each trajectory, so
# the set covers the seasons by construction and reproduces without any random state.

split = "test"
scenarios = [
  "bg_1919_v1_b",
  "bg_1919_v2_b",
  "bg_1919_v3_b",
  "cy_2007_v1_b",
  "cy_2007_v2_b",
  "cy_2007_v3_b",
  "de_1958_v1_b",
  "de_1958_v2_b",
  "de_1958_v3_b",
  "de_1979_v1_b",
  "de_1979_v2_b",
  "de_1979_v3_b",
  "fr_1949_v1_b",
  "fr_1949_v2_b",
  "fr_1949_v3_b",
  "fr_1968_v1_b",
  "fr_1968_v2_b",
  "fr_1968_v3_b",
  "ie_1994_v1_b",
  "ie_1994_v2_b",
  "ie_1994_v3_b",
  "ie_2005_v1_b",
  "ie_2005_v2_b",
  "ie_2005_v3_b",
  "no_1981_v1_b",
  "no_1981_v2_b",
  "no_1981_v3_b",
  "pl_1967_v1_b",
  "pl_1967_v2_b",
  "pl_1967_v3_b",
]
view = "realistic"
use_forecast = true
horizon_hours = 24.0
history_days = [1, 2, 5, 21]
seeds = 20
probes = 5
probe_amplitude = 6.0
forecast_correction = 0.0
