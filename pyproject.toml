[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i4b"
version = "0.1.0"
description = "Building thermal models and heat pump simulation/MPC control (i4b)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "gymnasium>=1.1",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "pvlib>=0.11",
    "requests>=2.31",
    "casadi>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["i4b", "i4b_data"]
