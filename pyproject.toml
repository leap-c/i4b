[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i4b"
version = "0.1.0"
description = "Building simulation environments for control and reinforcement learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "gymnasium>=1.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "pvlib>=0.13",
    "PyYAML>=6.0",
    "jax>=0.6",
    "jaxlib>=0.6",
    "diffrax>=0.7",
]

[project.optional-dependencies]
mpc = [
    "casadi>=3.7",
]
rl = [
    "torch>=2.9",
    "tensorboard>=2.20",
    "stable-baselines3>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["i4b", "i4b_data"]

[tool.uv]
dev-dependencies = []
